<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>문자 보내기 · 법무사 맹주초 사무소</title>
<style>
  :root{color-scheme:light}
  body{margin:0;font:16px/1.6 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#1d2b2a;background:#f6f5f0;display:grid;min-height:100vh;place-items:center}
  main{width:min(560px,92vw);background:#fff;border-radius:16px;box-shadow:0 6px 30px rgba(0,0,0,.08);padding:24px;text-align:center}
  img.b{width:100%;height:auto;display:block;margin:0 auto 14px}
  a.go{display:inline-block;margin:14px 0 8px;padding:16px 30px;border-radius:12px;background:#0d4f4a;color:#fff;text-decoration:none;font-weight:700;font-size:19px}
  pre{white-space:pre-wrap;word-break:break-all;text-align:left;background:#f3f6f5;border-radius:10px;padding:10px 12px;font:14px/1.5 inherit;margin:10px 0 0;color:#3b4a48}
  p{margin:6px 0;color:#4a5856}
</style>
</head>
<body>
<main>
  <img class="b" src="banner.jpg" alt="법무사 맹주초 사무소">
  <p id="to"></p>
  <a class="go" id="go" href="#">💬 문자 앱 열기</a>
  <p>문자 앱이 열리면 내용을 확인하고 <b>전송</b>하세요.</p><p style="background:#eef6f4;border-radius:10px;padding:10px;margin-top:10px">보낸 뒤 <b>이 탭을 닫으면</b> 열려 있던 <b>회생·파산 업무 시스템 화면으로 그대로 돌아갑니다.</b><br>(업무 시스템은 꺼지지 않고 다른 탭에 그대로 있습니다)</p>
  <pre id="b"></pre>
</main>
<script>
(function(){
  /* 번호·문구는 주소의 # 뒤에만 있어 서버로 전송되지 않습니다. */
  var h=new URLSearchParams(location.hash.slice(1)),to=(h.get('to')||'').replace(/[^0-9]/g,''),b=h.get('b')||'';
  var ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var url='sms:'+to+(ios?'&':'?')+'body='+encodeURIComponent(b);
  document.getElementById('go').href=url;
  document.getElementById('to').textContent=to?('받는 분: '+to.replace(/^(\d{3})(\d{3,4})(\d{4})$/,'$1-$2-$3')):'받는 분 번호가 없습니다.';
  document.getElementById('b').textContent=b;
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  setTimeout(function(){location.href=url},300);
})();
</script>
</body>
</html>
